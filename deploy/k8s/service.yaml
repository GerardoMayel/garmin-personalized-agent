apiVersion: v1
kind: Service
metadata:
  name: garmin-api-service
  labels:
    app: garmin-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: garmin-api
---
apiVersion: v1
kind: Service
metadata:
  name: garmin-ui-service
  labels:
    app: garmin-ui
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
      name: http
  selector:
    app: garmin-ui
