[project]
name = "garmin-personalized-agent"
version = "0.1.0"
description = "Personalized analytical system and agentic architecture for Garmin Connect physiological and biomechanical telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Gerardo Mayel Fernandez Alamilla" }
]
dependencies = [
    # Core & Configuration
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    # Ingestion & Remote Storage
    "garminconnect>=0.2.19",
    "requests>=2.32.0",
    "boto3>=1.34.0",
    # Data Processing, Classical ML & Time Series
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.1",
    "prophet>=1.4.0",
    # RAG Knowledge Base, Chunking & Vector DB (Phase 1 & Phase 2)
    "pypdf>=4.2.0",
    "langdetect>=1.0.9",
    "tiktoken>=0.7.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.5.0",
    "huggingface_hub>=0.23.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "ipykernel>=6.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
