[project]
name = "garmin-personalized-agent"
version = "0.1.0"
description = "Personalized analytical system and agentic architecture for Garmin Connect physiological and biomechanical telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Gerardo Mayel Fernandez Alamilla" }
]
dependencies = [
    # Core & Configurations
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    # Ingestion & Garmin API
    "garminconnect>=0.2.19",
    "fitparse>=1.2.0",
    "requests>=2.32.0",
    # Data Processing & Classical ML / Time Series
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4.0",
    # Vector DB & RAG
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
    "pypdf>=4.2.0",
    # Agentic Framework & LLM Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.7",
    "langchain-anthropic>=0.1.15",
    # API & Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Visualization & UI
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pydeck>=0.9.1",
    "pillow>=10.3.0",
    "matplotlib>=3.8.0",
    "boto3>=1.43.97",
]

[project.optional-dependencies]
training = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "trl>=0.8.6",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "ipykernel>=6.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
