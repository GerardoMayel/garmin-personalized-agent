name: Knowledge Base Pipeline - Ingestion, Chunks & Parquet Sync (Cloudflare R2)

on:
  schedule:
    # Runs at 06:00 UTC on day 1 of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download, verification, and re-chunking of all documents'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  knowledge-base-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync

      - name: Restore Knowledge Base & Processed Chunks from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m src.common.r2_storage --restore-kb || true
          uv run python -m src.common.r2_storage --restore-chunks || true

      - name: "Proceso 1: Sincronizar Dispositivos Garmin y Sensores (Max 15 PDFs a R2)"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          EXTRA_FLAGS="--r2-sync"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --force"
          fi
          uv run python -m src.ingestion.sync_garmin_device_papers $EXTRA_FLAGS

      - name: "Proceso 2: Sincronizar Variables en el Cuerpo Humano (Max 15 PDFs a R2)"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          EXTRA_FLAGS="--r2-sync"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --force"
          fi
          uv run python -m src.ingestion.sync_human_physiology_papers $EXTRA_FLAGS

      - name: "Proceso 3: Sincronizar Glosario y Descripciones de Métricas Garmin"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m src.ingestion.sync_garmin_metric_descriptions --r2-sync

      - name: "Componente Chunker: Token Splitter (400 tokens / 40% overlap), NLP & Datasets Parquet"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA_CHUNK_FLAGS="--r2-sync"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_CHUNK_FLAGS="$EXTRA_CHUNK_FLAGS --force"
          fi
          uv run python -m src.rag.loader_and_chunker $EXTRA_CHUNK_FLAGS

      - name: Verify Cloudflare R2 Knowledge Base & Processed Chunks Persistence
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m src.common.r2_storage --sync-kb
          uv run python -m src.common.r2_storage --sync-chunks

      - name: Upload Sync Artifacts (Logs, Ledger & Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-sync-report-${{ github.run_number }}
          path: |
            logs/
            data/knowledge_base/processed_chunks/_ledger.json
          retention-days: 30

      - name: Report Pipeline Status
        run: |
          echo "✅ Pipeline completado: 3 Fuentes procesadas y sincronizadas en Cloudflare R2 (garmin-personal-data/knowledge_base/)."
