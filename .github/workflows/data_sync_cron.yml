name: Data Sync Cron - Daily Garmin Ingestion Pipeline

on:
  schedule:
    # Trigger daily at 00:01 UTC (fetching the completed previous day's metrics and sleep)
    - cron: '1 0 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of historical days to fetch (default: 2 for yesterday + today)'
        required: false
        default: '2'
      date:
        description: 'Specific date to fetch in YYYY-MM-DD format (overrides days_back)'
        required: false
        default: ''

jobs:
  sync-garmin-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync

      - name: Restore Garmin Session Tokens & Database Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.garminconnect
          key: garmin-sync-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            garmin-sync-${{ runner.os }}-

      - name: Execute Garmin Sync Pipeline
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_STORE: ~/.garminconnect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            uv run python -m src.ingestion.sync_pipeline --date "${{ github.event.inputs.date }}"
          else
            DAYS="${{ github.event.inputs.days_back || '2' }}"
            uv run python -m src.ingestion.sync_pipeline --days-back "$DAYS"
          fi

      - name: Commit and Push Updated SQLite Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/garmin_history.db
          if git diff --staged --quiet; then
            echo "No changes in SQLite database to commit."
          else
            git commit -m "chore(data): auto-update Garmin SQLite database [skip ci]" \
                       -m "Co-authored-by: Antigravity Agent <antigravity-bot@google.internal>"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Synced Database & Ingestion Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garmin-sync-data-${{ github.run_number }}
          path: |
            data/processed/garmin_history.db
            data/raw/
            logs/
          retention-days: 30

      - name: Log Sync Completion
        run: echo "Garmin sync pipeline completed successfully."
