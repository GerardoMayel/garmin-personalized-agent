name: Data Sync Cron - Daily Garmin Ingestion Pipeline

on:
  schedule:
    # Trigger daily at 00:01 UTC (fetching the completed previous day's metrics and sleep)
    - cron: '1 0 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of historical days to reconcile a día vencido (default: 15)'
        required: false
        default: '15'
      date:
        description: 'Specific date to fetch in YYYY-MM-DD format (overrides days_back)'
        required: false
        default: ''

jobs:
  sync-garmin-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync

      - name: Restore Garmin Session Tokens
        uses: actions/cache@v4
        with:
          path: |
            ~/.garminconnect
          key: garmin-sync-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            garmin-sync-${{ runner.os }}-

      - name: Restore Historical Database from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m src.common.r2_storage --restore-db || true

      - name: Restore Predictions Database from Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m src.common.r2_storage --restore-forecast || true

      - name: Execute Garmin Sync, Ingestion & Biometric Forecasting
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_STORE: ~/.garminconnect
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            uv run python -m src.ingestion.sync_pipeline --date "${{ github.event.inputs.date }}" --r2-sync
          else
            DAYS="${{ github.event.inputs.days_back || '15' }}"
            uv run python -m src.ingestion.sync_pipeline --days-back "$DAYS" --reconcile --r2-sync
          fi

      - name: Upload Ingestion Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garmin-sync-data-${{ github.run_number }}
          path: |
            data/processed/garmin_history.db
            data/processed/predictions/
            data/dvc/
            data/artifacts/
            data/raw/
            logs/
          retention-days: 30

      - name: Log Sync Completion
        run: echo "Garmin sync and Cloudflare R2 cloud persistence completed successfully."
