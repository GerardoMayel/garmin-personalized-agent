name: Data Sync Cron - Daily Garmin Ingestion Pipeline

on:
  schedule:
    # Trigger daily at 06:00 UTC (syncing last night's sleep and activities)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of historical days to fetch'
        required: false
        default: '1'

jobs:
  sync-garmin-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync

      - name: Execute Garmin Sync Pipeline
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_STORE: ${{ runner.temp }}/garmin_tokens
        run: |
          uv run python -m src.ingestion.sync_pipeline --days-back ${{ github.event.inputs.days_back || 1 }}

      - name: Log Sync Completion
        run: echo "Garmin sync pipeline completed successfully."
