# =====================================================================
# LoRA / PEFT Fine-Tuning Hyperparameters
# =====================================================================

model:
  base_model_name: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: "bfloat16"
  use_4bit_quantization: true
  trust_remote_code: true

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./checkpoints/lora_garmin_expert"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  max_seq_length: 2048
  fp16: false
  bf16: true
  dataset_text_field: "messages"
