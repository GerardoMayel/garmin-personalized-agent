# =====================================================================
# LoRA / PEFT Supervised Fine-Tuning Hyperparameters
# Garmin Mexican Fitness Coach SFT
# =====================================================================

model:
  # Base models: "Qwen/Qwen2.5-1.5B-Instruct", "meta-llama/Llama-3.2-1B-Instruct", "Qwen/Qwen2.5-3B-Instruct"
  base_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  use_4bit_quantization: false  # bitsandbytes 4-bit (activar en GPU CUDA; desactivar en Apple Silicon MPS / CPU)

dataset:
  local_path: "data/synthetic/synthetic_dataset_400.jsonl"
  hf_repo_id: "GerardoMayel/garmin-mexican-fitness-coach-sft"
  val_split_ratio: 0.1  # 90% entrenamiento (360 ejemplos), 10% validación (40 ejemplos)
  seed: 42
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./checkpoints/lora_garmin_mexican_coach"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  fp16: false
  bf16: false  # Auto-configurado según el hardware detectado (MPS/CUDA/CPU)
  dataloader_num_workers: 0
