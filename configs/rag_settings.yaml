# =====================================================================
# Clinical RAG Architecture & Retrieval Settings
# =====================================================================

embedding:
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  dimension: 768
  device: "cpu"  # or "cuda" / "mps"
  batch_size: 32

chunking:
  chunk_size: 600
  chunk_overlap: 120
  separators: ["\n## ", "\n### ", "\n\n", "\n", ". ", " "]

vector_store:
  backend: "qdrant" # "qdrant" or "chroma"
  collection_name: "medical_sports_consensus"
  distance_metric: "Cosine"
  host: "localhost"
  port: 6333

retrieval:
  top_k: 10
  hybrid_search: true
  bm25_weight: 0.3
  vector_weight: 0.7

reranker:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 4
